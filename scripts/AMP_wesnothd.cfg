# wesnothd.cfg - ECRIT PAR AMP a chaque demarrage, a partir de AMP_wesnothd.cfg.
# Ne le modifie pas a la main : change les reglages dans l'onglet Configuration
# d'AMP. Pour un reglage en plus, ecris-le dans perso.cfg.
#
# Les textes sont des chaines brutes WML, entre << et >> : accents, virgules,
# apostrophes, accolades et diese y passent tels quels (essai du 10/10/2026).
# Entre guillemets droits, une accolade serait lue comme une macro du
# preprocesseur WML et wesnothd s'arreterait net au demarrage.
motd=<<{{motd}}>>
passwd=<<{{passwd}}>>
versions_accepted=<<{{versions_accepted}}>>
connections_allowed={{connections_allowed}}
ban_save_file="bans.cfg.gz"
fifo_path="remplace au demarrage par lancer-wesnothd.sh"
{./perso.cfg}
